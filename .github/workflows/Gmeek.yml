name: build Gmeek

on:
  # 改了站点配置或自定义静态资源时立即重建（Gmeek 自己的提交不碰这两个路径，不会自触发循环）
  push:
    paths:
      - config.json
      - static/**
  workflow_dispatch:
    inputs:
      issue_number:
        description: "只重建指定 issue 编号（留空 = 全量重建）"
        required: false
        default: ""
  issues:
    # opened/edited/reopened/labeled/unlabeled/pinned/unpinned 走增量（只重建这一篇）
    # closed/deleted/transferred 走全量（issue 已不可见，必须整体重建才能摘掉旧文章）
    types: [opened, edited, reopened, closed, deleted, transferred, labeled, unlabeled, pinned, unpinned]
  schedule:
    - cron: "0 16 * * 0"      # 每周一次：UTC 周日 16:00 = 北京时间周一 00:00

# 串行化构建：定时 / issue / push 同时触发时避免并发改写 docs/ 再抢推；
# 取消排队中的旧任务不丢数据 —— 每次构建都从 issues 重新生成，推送是原子的
concurrency:
  group: gmeek-build
  cancel-in-progress: true

jobs:
  build:
    name: Generate blog
    # 固定镜像而不用 ubuntu-latest：latest 已迁到 26.04，其预编译 Python 不覆盖 3.12 以下的旧版本
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.event.repository.owner.id == github.event.sender.id || github.event_name == 'schedule' || github.event_name == 'push' }}
    permissions:
      contents: write          # 需要把生成的 docs/ 推回仓库
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0       # 完整历史，便于后面 git pull --rebase

      - name: Check config.json
        run: |
          set -euo pipefail
          echo "====== config.json ======"
          cat config.json
          echo "====== end ======"
          command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Clone source code
        run: |
          set -euo pipefail
          GMEEK_VERSION="$(jq -r '.GMEEK_VERSION // "last"' config.json)"
          git clone https://github.com/Meekdai/Gmeek.git /opt/Gmeek
          cd /opt/Gmeek
          if [ "$GMEEK_VERSION" = "last" ]; then
            GMEEK_VERSION="$(git describe --tags "$(git rev-list --tags --max-count=1)")"
          fi
          git checkout "$GMEEK_VERSION"
          echo "Gmeek version: $GMEEK_VERSION ($(git rev-parse --short HEAD))"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r /opt/Gmeek/requirements.txt "PyGithub<3"

      - name: Generate new html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 手动填写的编号优先，issue 事件则回落到当次 issue
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          # 关闭 / 删除 / 转移后 issue 已查不到，runOne 会直接返回并把旧文章留在站点上，
          # 所以这些动作必须清空编号、改走全量重建
          case "$EVENT_ACTION" in
            closed|deleted|transferred) ISSUE_NUMBER="" ;;
          esac
          # 排除 .git：别用仓库的 git 元数据覆盖 /opt/Gmeek/.git
          rsync -a --exclude=.git ./ /opt/Gmeek/
          cd /opt/Gmeek
          python Gmeek.py "$GH_TOKEN" "${{ github.repository }}" --issue_number "$ISSUE_NUMBER"
          cp -a /opt/Gmeek/docs "${{ github.workspace }}"
          cp -a /opt/Gmeek/backup "${{ github.workspace }}"
          cp /opt/Gmeek/blogBase.json "${{ github.workspace }}"

      - name: Update html
        run: |
          set -euo pipefail
          EMAIL="$(jq -r '.email // "github-actions[bot]@users.noreply.github.com"' config.json)"
          git config --local user.email "$EMAIL"
          git config --local user.name "${{ github.repository_owner }}"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m '🎉auto update by Gmeek action'
            git pull --rebase --autostash
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/.'

  deploy:
    name: Deploy blog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
