<footer class="site-footer" id="footer">
    <div class="footer-main">
        <span>© <span id="copyrightYear"></span> <a href="{{ blogBase['homeUrl'] }}/">{{ blogBase['title']|e }}</a></span>
        <span class="footer-sep" aria-hidden="true">·</span>
        <span id="runday"></span>
        {% if blogBase['filingNum'] %}<span class="footer-sep" aria-hidden="true">·</span><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">{{ blogBase['filingNum'] }}</a>{% endif %}
    </div>
    <nav class="footer-links" aria-label="页脚">
        <a href="{{ blogBase['homeUrl'] }}/tag.html">归档</a>
        <a href="{{ blogBase['homeUrl'] }}/rss.xml">RSS</a>
        {% if blogBase['email'] %}<a href="mailto:{{ blogBase['email'] }}">邮件</a>{% endif %}
        <span class="footer-powered">Powered by <a href="https://meekdai.com/Gmeek.html" target="_blank" rel="noopener">Gmeek</a></span>
    </nav>
</footer>

<script>
(function () {
    var now = new Date();
    var year = document.getElementById("copyrightYear");
    if (year) { year.textContent = now.getFullYear(); }
    if ("{{ blogBase['startSite'] }}" !== "") {
        var startSite = new Date("{{ blogBase['startSite'] }}");
        var diffDay = Math.floor((now.getTime() - startSite.getTime()) / 86400000);
        var runday = document.getElementById("runday");
        if (runday && !isNaN(diffDay)) { runday.textContent = "{{ i18n['run'] }}" + diffDay + "{{ i18n['days'] }}"; }
    }
})();
</script>
